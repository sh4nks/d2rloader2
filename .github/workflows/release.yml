name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git gcc cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-svg \
            kirigami kirigami-addons ki18n knotifications kcolorscheme \
            kiconthemes kcoreaddons kconfig qqc2-desktop-style breeze
      - uses: actions/checkout@v7
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: build-appimage/D2RLoader-*-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.someblocks.d2rloader.yml
          bundle: D2RLoader-${{ env.VERSION }}-x86_64.flatpak
          artifact-name: flatpak

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          # The package list from the README's "Windows" section.
          pacboy: >-
            gcc:p cmake:p ninja:p qt6-base:p qt6-declarative:p qt6-svg:p
            extra-cmake-modules:p kirigami:p kirigami-addons:p ki18n:p
            knotifications:p kcolorscheme:p kiconthemes:p kcoreaddons:p
            kconfig:p qqc2-desktop-style:p breeze:p breeze-icons:p icoutils:p
      - name: Build zip
        run: packaging/windows/build-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build-windows/D2RLoader-*-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.AppImage
            *.flatpak
            *.zip
          fail_on_unmatched_files: true
